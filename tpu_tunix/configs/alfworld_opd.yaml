# Mirrors TCOD_examples/alfworld/opd.yaml where the concepts carry over.
student: Qwen/Qwen2.5-1.5B-Instruct
teacher: /path/to/teacher          # must share the student's tokenizer
# teacher_model_name: qwen2.5-7b-instruct   # needed for local dirs

train_file: ../TCOD_examples/alfworld/alfworld_data/train.jsonl
eval_file: ../TCOD_examples/alfworld/alfworld_data/test.jsonl
game_path_prefix_from: /data/hs2352/LookAheadOPD/alf-data/
game_path_prefix_to: /home/haojun_shi/alf-data/

batch_size: 16
max_env_steps: 30
max_prompt_length: 1536
max_response_tokens: 512
temperature: 1.0
eval_temperature: 0.4

total_steps: 250
mini_batch_size: 64
micro_batch_size: 2
lr: 1.0e-6
grad_clip: 1.0
kl_coef: 1.0

eval_interval: 5
eval_episodes: 32
log_dir: ./logs/alfworld_opd
