# Gated OPD, DISAGREEMENT + STUDENT LOOK-AHEAD + TEACHER LOOK-AHEAD
# (OPD_gated_alfworld_workflow_student_teacher_lookahead). Per step the teacher is asked
#   (A) would you choose the student's action?  -> "disagrees" if it answers No
# and, only where it disagrees, both
#   (B) do the STUDENT's next `progress_window_size` steps make progress? (the final window
#       uses the episode outcome), and
#   (C) the TEACHER itself plays the next `progress_window_size` steps from that position (in
#       a replayed copy of the game) and is asked whether its own steps make progress.
# OPD weight of a disagreed step, with S = student NOT making progress, T = teacher making progress:
#   S and T      -> both_weight    (1.0)
#   T only       -> teacher_only_weight (0.7 in this config; the student progresses too)
#   S only       -> student_only_weight (0.3 in this config; neither side progresses)
#     (the only change from opd_gated_student_teacher_lookahead_deferred_tpu.yaml, which uses
#      one_weight 0.5 for both)
#   neither      -> neither_weight (0.0)
# A step the teacher agrees with gets 0. Unknown answers never lower the weight: an unparseable
# (B) counts as S, an unparseable (C) or a failed look-ahead counts as T.
# Compare opd_gated_disagree_lookahead_deferred_tpu.yaml (B only) and
# opd_gated_disagree_teacher_lookahead_deferred_tpu.yaml (C only).
#
# DEFERRED TEACHER (defer_teacher: true), free-running explorer (dynamic_by_explorer,
# sync_interval 1): the trainer asks the teacher, only for the 64 turns of each training
# batch; every teacher look-ahead runs as a Ray task (one CPU, any worker) that replays the
# game, so ~/alf-data must be at the same path on every worker (scripts/tpu/setup_node.sh).
# buffer.total_steps is only an upper bound; the run ends at trainer.total_steps.
#
# Qwen3-1.7B student / Qwen3-8B teacher on HALF of the v4-32 (8 chips), so that it can run beside the vanilla run
# opd_qwen3_1.7b_8b_fullmemory_8chip_tpu.yaml on the other half (user, 2026-10-31). Only the models and the chip layout
# differ from opd_gated_student_teacher_lookahead_t07_s03_deferred_tpu.yaml (4B / 30B-A3B, 16 chips).
#
# TPU layout (one 2-host Ray cluster of its own, scripts/tpu/start_cluster_pair.sh): worker 3 = trainer (4 chips),
# worker 2 = 2 students + 2 teachers, one chip each (no teacher_tpu label, so the teachers share the explorer_tpu host).
#   PAIR_IPS="10.130.15.214 10.130.15.212" bash ~/TCOD/scripts/tpu/start_cluster_pair.sh      # on worker 3
#   cd ~/TCOD && PATH=$HOME/venv-vllm-tpu/bin:$PATH trinity run --config TCOD_examples/alfworld/opd_gated_qwen3_1.7b_8b_t07_s03_deferred_8chip_tpu.yaml
# Launcher with checks, checkpoint links and eval: ~/tcod_runs/launch_alfworld_qwen3_1.7b_8b_pair.sh
project: "ALFWORLD_TCOD"
name: "alfworld_qwen3_1.7b_8b_opd_gated_t07_s03_deferred_8chip_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links for the checkpoints) is used

# Mechanism: trinity/common/workflows/envs/TCOD/alfworld/OPD_gated_workflow_student_teacher_lookahead.py

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: /dev/shm/models/Qwen3-1.7B  # TPU: tmpfs copy on both hosts
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 2      # TPU: 2 VMs x 4 chips; trainer = 8 - (2 students + 2 teachers) = 4
  gpu_per_node: 4

buffer:
  total_steps: 3000  # explorer steps: upper bound only (see header); the run ends on trainer.total_steps
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /home/haojun_shi/alf-data/tcod_tasks/train.jsonl  # TPU VM copy (game_file paths remapped)
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        # Required by OPD workflow to compute student-teacher token logprob gap
        logprobs: 0
      workflow_args:
        max_env_steps: 30
        # Teacher look-ahead: how many steps the teacher plays from a step it disagrees with,
        # and how it decodes them.
        progress_window_size: 5
        teacher_rollout_temperature: 0.0
        teacher_rollout_max_tokens: 512
        # Decoding for the progress judgment of the teacher's own steps.
        progress_temperature: 0.0
        progress_max_tokens: 512
        # Decoding for the agreement (yes/no) check -- same as opd_gated_fullmemory.yaml.
        consistency_temperature: 0.0
        consistency_max_tokens: 512
        # Weight of a step the teacher disagrees with, by its judgment of its own steps.
        # S = student not making progress, T = teacher making progress (see header)
        both_weight: 1.0
        teacher_only_weight: 0.7
        student_only_weight: 0.3
        neither_weight: 0.0
        # The trainer gates and scores the turns it samples; the explorer makes no teacher call.
        defer_teacher: true
        trainer_teacher_parallel_prompts: 32   # requests in flight per teacher engine
        # true: do not score turns whose weight is 0 (training is identical; see teacher_gate.py)
        skip_zero_weight_scoring: false
    default_workflow_type: 'OPD_gated_alfworld_workflow_student_teacher_lookahead'
  trainer_input:
    experience_buffer:
      name: alfworld_qwen3_1.7b_8b_opd_gated_t07_s03_deferred_8chip_tpu_buffer
      storage_type: queue
      path: 'sqlite:////dev/shm/tcod_buffers/alfworld_qwen3_1.7b_8b_opd_gated_t07_s03_deferred_8chip_tpu_buffer.db'  # node-local tmpfs: keeps the queue's second copy out of a home directory

explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 2  # TPU: 2 students, one chip each
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    # Teacher: logprob scoring of the trained turns plus the gate's questions and look-ahead games (from the trainer).
    - model_path: /dev/shm/models/Qwen3-8B  # TPU: tmpfs copy on the inference host
      engine_type: vllm_tpu
      engine_num: 2  # TPU: 2 teachers, one chip each
      tensor_parallel_size: 1
      # vLLM-TPU: leave ~7 GiB free for the prompt-logprobs (teacher scoring) program; 16 GiB of bf16 weights + KV
      # cache otherwise fill the chip at the 0.9 default (opd_tpu_repro_1.7b_8b_tpu16.yaml)
      gpu_memory_utilization: 0.75
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 250
  save_interval: 50  # checkpoints on worker 0 tmpfs (launcher links)
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs (NFS-shared from worker 0)

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
