# avg@4 evaluation of the TPU run alfworld_opd_tpu_repro_1.7b_8b_tpu16 (global_step_100)
# on ALFWorld valid_seen (test.jsonl, 140 games) and valid_unseen (test_unseen.jsonl, 134 games).
# The checkpoint is served as the student's model_path and evaluated once via
# eval_on_startup (bench mode's own checkpoint loader only understands verl layouts).
# Each game is played 4 times (repeat_times: 4); avg@4 = mean success (env_done) over all runs.
# Workflow/prompt/max_env_steps as in training; eval temperature 0.4 (repo convention, tcod_f2b.yaml).
# The fullmemory workflow always scores turns with the teacher, so the 8B teacher is kept.
mode: bench
project: "ALFWORLD_TCOD"
name: "eval_opd_tpu_repro_1.7b_8b_tpu16_step100"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: false  # resume is not implemented for the tunix trainer yet

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: /home/haojun_shi/TCOD/checkpoints/ALFWORLD_TCOD/alfworld_opd_tpu_repro_1.7b_8b_tpu16_20260929231742/global_step_100/actor/huggingface
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  # All 16 chips of the v4-32 (4 VMs x 4). Trainer = 16 - (4 + 8) = 4 chips (one host).
  # Placement (multi-host): worker 0 started with --resources '{"trainer_tpu": 4}',
  # workers 1-3 with '{"explorer_tpu": 4}'; checkpoints/ is NFS-shared from worker 0.
  node_num: 4
  gpu_per_node: 4

buffer:
  total_steps: 100
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /home/haojun_shi/alf-data/tcod_tasks/train.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
    eval_tasksets:
      - name: alfworld_valid_seen
        storage_type: file
        path: /home/haojun_shi/alf-data/tcod_tasks/test.jsonl
        split: test
        repeat_times: 4
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          logprobs: 0
        workflow_args:
          max_env_steps: 30
      - name: alfworld_valid_unseen
        storage_type: file
        path: /home/haojun_shi/alf-data/tcod_tasks/test_unseen.jsonl
        split: test
        repeat_times: 4
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          logprobs: 0
        workflow_args:
          max_env_steps: 30
    default_workflow_type: 'OPD_alfworld_workflow_fullmemory'
  trainer_input:
    experience_buffer:
      name: eval_opd_tpu16_step100_buffer
      storage_type: queue
      path: 'sqlite:///eval_opd_tpu16_step100_buffer.db'

explorer:
  eval_on_startup: true
  bench_on_latest_checkpoint: false
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 4  # GPU run: 3
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    - model_path: Qwen/Qwen3-8B
      engine_type: vllm_tpu
      # GPU run: 1. The teacher re-scores the full growing prompt with an 8B model every
      # turn (~4-5x the student's per-turn work), so it gets most explorer chips.
      engine_num: 8
      tensor_parallel_size: 1
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      # vLLM-TPU: leave ~7 GiB free for the prompt-logprobs (teacher scoring) program;
      # 16 GiB of bf16 weights + KV cache otherwise fill the chip at the 0.9 default.
      gpu_memory_utilization: 0.75
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix
  total_steps: 100
  save_interval: 25
  grad_clip: 1.0

monitor:
  monitor_type: tensorboard
  detailed_stats: true
