# FutureBridge-OPD (FTB), "Look Ahead Before You Distill" (https://github.com/ChenChiShui/FutureBridge-OPD,
# commit e73603a), with OUR student / teacher: plain Qwen3-4B / plain Qwen3-30B-A3B (the release's
# 4B config, configs/alfworld/ftb_qwen3_32b_to_4b.yaml, uses a Qwen3-32B teacher).
# Workflow: trinity/common/workflows/envs/TCOD/alfworld/futurebridge_workflow.py (copied from the
# release; two marked fixes, see its docstring). What it does per training episode:
#   1. Back-to-front curriculum (TCOD-B2F): the game is advanced along the expert trajectory by
#      k = max(0, len(expert) - 1 - explore_step // checkpoint_steps) actions; the Student plays on.
#   2. Vanilla OPD on every Student turn (the Teacher scores all turns).
#   3. On FAILED episodes: at the Student turn with the largest token-average disagreement, the
#      Teacher writes its own response from the same context (the "bridge"). The game is replayed
#      to that point, the bridge action is executed, and the frozen Student continues for
#      `continuation_steps` (3) turns. The bridge turn is added to the training data only if the
#      share of continuation tokens the Teacher prefers (teacher logprob > student logprob) is
#      higher than on the Student's original next 3 turns.
#
# As in the release (configs/alfworld/ftb_qwen3_32b_to_4b.yaml and the code's defaults):
# prompt templates (TCOD's original, with mandatory <think> tags: ftb_release_utils.py),
# curriculum (linear, checkpoint_steps 5), bridge settings, 200 training steps, 6 runners per
# engine, Teacher prompt limit 10240, lr, loss, thinking mode off.
# Not as in the release: the Teacher model (ours); the TPU backends and engine layout; a
# checkpoint every 50 steps instead of every 10 (20 checkpoints of 8.3 GB do not fit here).
# NOTE for evaluation: scripts/tpu/eval uses this repo's prompt template, not the release's.
# Needs the expert trajectories: ~/alf-data/tcod_tasks/train_expert.jsonl on every worker
# (the release's train_expert.jsonl with game_file paths remapped; same 3553 games and order as
# train.jsonl, 121 of them without expert actions).
#
# The Teacher's work is done in the explorer for every episode (defer_teacher does not apply:
# choosing the bridge turn needs the Teacher's scores of the whole episode), so expect the pace
# of the non-deferred runs. NOT YET RUN on TPU: the Student engines must also score token
# sequences (logprobs) here, which no earlier TPU run exercised.
#
# TPU layout (v4-32): worker 0 = trainer, workers 1-2 = one 30B-A3B teacher each, worker 3 = 4
# students. Bring-up and launch:
#   WORKER_ROLES="trainer teacher teacher explorer" TEACHER_MODEL=Qwen/Qwen3-30B-A3B \
#     bash ~/TCOD/scripts/tpu/start_cluster.sh
#   cd ~/TCOD && PATH=$HOME/venv-vllm-tpu/bin:$PATH setsid nohup \
#     trinity run --config TCOD_examples/alfworld/ftb_qwen3_30b_to_4b_tpu.yaml > ~/train.log 2>&1 < /dev/null &
# See scripts/tpu/README.md.
project: "ALFWORLD_TCOD"
name: "alfworld_ftb_qwen3_30b_to_4b_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links for steps 150-200) is used

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  # Student model: plain Qwen/Qwen3-4B -- same as opd_gated_lookahead.yaml.
  model_path: Qwen/Qwen3-4B
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 4      # TPU: 4 VMs x 4 chips; trainer = 16 - (4 students + 2 x 4 teacher) = 4
  gpu_per_node: 4

buffer:
  total_steps: 300  # explorer steps: > trainer.total_steps so the run ends on exactly 200 training steps
  # Rollout batch: games per explore step. 16 as in the GPU configs (the sibling
  # opd_gated_disagree_lookahead_tpu.yaml uses 8).
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /home/haojun_shi/alf-data/tcod_tasks/train_expert.jsonl  # TPU VM copy (game_file paths remapped)
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        # Required by OPD workflow to compute student-teacher token logprob gap
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 30
        # Back-to-front curriculum, as in the release's 4B config
        total_steps: 200
        checkpoint_strategy: linear
        checkpoint_steps: 5
        # The release's keys, verbatim. Its ALFWorld workflow does not read them; it uses its
        # defaults bridge_kl_top_ratio 0.3 (turns tried, most-disagreed first, until one bridge is
        # kept), bridge_kl_max_per_ep 1 and 3 continuation turns, and bridges failed episodes only.
        bridge_position_top_k: 1
        bridge_max_per_ep: 1
        continuation_steps: 3
        bridge_failed_episodes_only: false
        bridge_require_full_continuation: true
    default_workflow_type: 'FutureBridgeAlfworldWorkflow'
  trainer_input:
    experience_buffer:
      name: alfworld_ftb_qwen3_30b_to_4b_tpu_buffer
      storage_type: queue
      # Absolute path on node-local tmpfs (the dir must exist on every worker). A relative path is
      # created in the home directory of whichever worker hosts the queue actor and silently
      # fills that worker's disk (this stopped the first attempt at step 37).
      path: 'sqlite:////dev/shm/tcod_buffers/alfworld_ftb_qwen3_30b_to_4b_tpu_buffer.db'

explorer:
  eval_interval: 5
  runner_per_model: 6  # as in the release
  max_timeout: 3600
  rollout_model:
    # engine_num=2, tensor_parallel_size=1 -- matches opd_gated_lookahead.yaml.
    engine_type: vllm_tpu
    engine_num: 4  # TPU: 4 students, one chip each (GPU run: 2)
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    # Teacher model: plain Qwen/Qwen3-30B-A3B -- same as
    # opd_gated_lookahead.yaml. Called once per turn for logprobs scoring,
    # plus once per windowed gate decision (~N-5 calls per trajectory).
    - model_path: /dev/shm/models/Qwen3-30B-A3B  # TPU: tmpfs copy on each teacher VM (start_cluster.sh)
      engine_type: vllm_tpu
      engine_num: 2  # TPU: two teachers, one whole VM each (GPU run: 1)
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.8  # TPU: tested on v4 (fits; 321k-token KV cache)
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 10240  # as in the release: bridge turns are generated by the teacher and must fit the trainer's 10240-token prompt limit
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 200  # as in the release
  save_interval: 50  # TPU: disk on worker 0 (see header); GPU run: 25
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
