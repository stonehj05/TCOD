# Vanilla OPD on ALFWorld, Qwen3-1.7B student / Qwen3-8B teacher, on HALF of the v4-32 (8 chips), so that it can run
# beside the gated run opd_gated_qwen3_1.7b_8b_t07_s03_deferred_8chip_tpu.yaml on the other half (user, 2026-10-31).
# Workflow OPD_alfworld_workflow_fullmemory with the teacher scoring on the EXPLORER side (not deferred, user): every
# turn of every game is scored by the teacher as it is played. Otherwise the settings of opd_fullmemory_deferred_tpu.yaml
# (full memory, 30 env steps, 10240 + 512 tokens, 16 games per explore step, 64 turns per training step, lr 1e-6,
# staleness control 2), 250 training steps, a checkpoint every 50.
#
# TPU layout (one 2-host Ray cluster of its own, scripts/tpu/start_cluster_pair.sh): worker 0 = trainer (4 chips),
# worker 1 = 2 students + 2 teachers, one chip each (no teacher_tpu label, so the teachers share the explorer_tpu host).
#   PAIR_IPS="10.130.15.213 10.130.15.215" bash ~/TCOD/scripts/tpu/start_cluster_pair.sh      # on worker 0
#   cd ~/TCOD && PATH=$HOME/venv-vllm-tpu/bin:$PATH trinity run --config TCOD_examples/alfworld/opd_qwen3_1.7b_8b_fullmemory_8chip_tpu.yaml
# Launcher with checks, checkpoint links and eval: ~/tcod_runs/launch_alfworld_qwen3_1.7b_8b_pair.sh
project: "ALFWORLD_TCOD"
name: "alfworld_qwen3_1.7b_8b_opd_fullmemory_8chip_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links for the checkpoints) is used

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: /dev/shm/models/Qwen3-1.7B  # TPU: tmpfs copy on both hosts
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 2      # TPU: 2 VMs x 4 chips; trainer = 8 - (2 students + 2 teachers) = 4
  gpu_per_node: 4

buffer:
  total_steps: 3000  # explorer steps: upper bound only; the run ends on trainer.total_steps
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /home/haojun_shi/alf-data/tcod_tasks/train.jsonl  # TPU VM copy (game_file paths remapped)
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        # Required by OPD workflow to compute student-teacher token logprob gap
        logprobs: 0
      workflow_args:
        max_env_steps: 30
    default_workflow_type: 'OPD_alfworld_workflow_fullmemory'
  trainer_input:
    experience_buffer:
      name: alfworld_qwen3_1.7b_8b_opd_fullmemory_8chip_tpu_buffer
      storage_type: queue
      path: 'sqlite:////dev/shm/tcod_buffers/alfworld_qwen3_1.7b_8b_opd_fullmemory_8chip_tpu_buffer.db'  # node-local tmpfs: keeps the queue's second copy out of a home directory

explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 2  # TPU: 2 students, one chip each
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    - model_path: /dev/shm/models/Qwen3-8B  # TPU: tmpfs copy on the inference host
      engine_type: vllm_tpu
      engine_num: 2  # TPU: 2 teachers, one chip each
      tensor_parallel_size: 1
      # vLLM-TPU: leave ~7 GiB free for the prompt-logprobs (teacher scoring) program; 16 GiB of bf16 weights + KV
      # cache otherwise fill the chip at the 0.9 default (opd_tpu_repro_1.7b_8b_tpu16.yaml)
      gpu_memory_utilization: 0.75
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer
  total_steps: 250
  save_interval: 50  # checkpoints on worker 0 tmpfs (launcher links)
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs (NFS-shared from worker 0)

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
