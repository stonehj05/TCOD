# TCOD-b2f (Backward-to-Forward temporal curriculum), the repo's original
# TCOD_examples/alfworld/tcod_b2f.yaml on Cloud TPU with OUR student / teacher: plain Qwen3-4B /
# plain Qwen3-30B-A3B (the original names Qwen2.5-1.5B-Instruct and a placeholder teacher).
# Workflow: TCOD_b2f_alfworld_workflow (unchanged). Per training episode the game is advanced
# along the expert trajectory by k = max(0, len(expert) - 1 - explore_step // checkpoint_steps)
# actions and the Student plays on from there; vanilla OPD on every Student turn. So early
# training sees only the last turns of a game and the Student's part grows by one turn every
# 5 explore steps.
#
# As in the original: algorithm, lr, batch sizes, curriculum (linear, checkpoint_steps 5,
# total_steps 250), temperatures, 30 env steps, 8 runners per engine, token limits, 250
# training steps, dynamic_by_explorer sync. The Teacher scores in the explorer (no defer_teacher).
# Not as in the original: the models; the TPU backends and engine layout; checkpoint sync
# instead of NCCL; a checkpoint every 50 steps (original: final only); no in-training eval
# taskset (evaluated afterwards with scripts/tpu/eval); tensorboard instead of wandb.
# Prompt template: this repo's utils.py (changed in fb425db from the first release: no <think>
# tags), the same one scripts/tpu/eval uses.
# Needs ~/alf-data/tcod_tasks/train_expert.jsonl on every worker (expert trajectories).
#
# TPU layout (v4-32): worker 0 = trainer, workers 1-2 = one 30B-A3B teacher each, worker 3 = 4
# students. Bring-up and launch:
#   WORKER_ROLES="trainer teacher teacher explorer" TEACHER_MODEL=Qwen/Qwen3-30B-A3B \
#     bash ~/TCOD/scripts/tpu/start_cluster.sh
#   cd ~/TCOD && PATH=$HOME/venv-vllm-tpu/bin:$PATH setsid nohup \
#     trinity run --config TCOD_examples/alfworld/tcod_b2f_qwen3_30b_to_4b_tpu.yaml > ~/train.log 2>&1 < /dev/null &
# See scripts/tpu/README.md.
project: "ALFWORLD_TCOD"
name: "alfworld_tcod_b2f_qwen3_30b_to_4b_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links for steps 150-250) is used

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  # Student model: plain Qwen/Qwen3-4B -- same as opd_gated_lookahead.yaml.
  model_path: Qwen/Qwen3-4B
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 4      # TPU: 4 VMs x 4 chips; trainer = 16 - (4 students + 2 x 4 teacher) = 4
  gpu_per_node: 4

buffer:
  total_steps: 400  # explorer steps: upper bound only (original: 250); the run ends on trainer.total_steps
  # Rollout batch: games per explore step. 16 as in the GPU configs (the sibling
  # opd_gated_disagree_lookahead_tpu.yaml uses 8).
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /home/haojun_shi/alf-data/tcod_tasks/train_expert.jsonl  # TPU VM copy (game_file paths remapped)
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        # Required by OPD workflow to compute student-teacher token logprob gap
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 30
        # Back-to-front curriculum, as in tcod_b2f.yaml
        total_steps: 250
        checkpoint_strategy: linear
        checkpoint_steps: 5
    default_workflow_type: 'TCOD_b2f_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_tcod_b2f_qwen3_30b_to_4b_tpu_buffer
      storage_type: queue
      # Absolute path on node-local tmpfs (the dir must exist on every worker). A relative path is
      # created in the home directory of whichever worker hosts the queue actor and silently
      # fills that worker's disk.
      path: 'sqlite:////dev/shm/tcod_buffers/alfworld_tcod_b2f_qwen3_30b_to_4b_tpu_buffer.db'

explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    # engine_num=2, tensor_parallel_size=1 -- matches opd_gated_lookahead.yaml.
    engine_type: vllm_tpu
    engine_num: 4  # TPU: 4 students, one chip each (GPU run: 2)
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    # Teacher model: plain Qwen/Qwen3-30B-A3B -- same as
    # opd_gated_lookahead.yaml. Called once per turn for logprobs scoring,
    # plus once per windowed gate decision (~N-5 calls per trajectory).
    - model_path: /dev/shm/models/Qwen3-30B-A3B  # TPU: tmpfs copy on each teacher VM (start_cluster.sh)
      engine_type: vllm_tpu
      engine_num: 2  # TPU: two teachers, one whole VM each (GPU run: 1)
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.8  # TPU: tested on v4 (fits; 321k-token KV cache)
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 250
  save_interval: 50  # original: 250 (final only); every 50 here so the run can be evaluated along the way
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
