# TPU (v4, 2 hosts x 4 chips) port of opd_tpu_repro_1.7b_8b.yaml (GPU), for GPU-vs-TPU comparison
# against the GPU run of opd_tpu_repro_1.7b_8b.yaml: Qwen3-1.7B student / Qwen3-8B
# teacher, OPD_alfworld_workflow_fullmemory, 100 steps, tensorboard.
#
# Only hardware-specific settings differ from the GPU pipeline (algorithm, workflow,
# buffer and staleness control are unchanged):
# - explorer engines use engine_type vllm_tpu (vLLM TPU backend), one chip each
#   (student + teacher); the trainer uses trainer_type tunix (JAX) on the other two
#   chips. The "gpu" fields below count TPU chips.
# - synchronizer uses sync_method checkpoint (NCCL is CUDA-only): the trainer writes a
#   HF checkpoint at every sync and the vLLM-TPU engines load it in place.
# - the task file points at the local ALFWorld copy (game_file paths remapped).
#
# Launch: trinity run --config TCOD_examples/alfworld/opd_fullmemory_tpu.yaml
project: "ALFWORLD_TCOD"
name: "alfworld_opd_tpu_repro_1.7b_8b_tpu16"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: false  # resume is not implemented for the tunix trainer yet

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: Qwen/Qwen3-1.7B
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  # All 16 chips of the v4-32 (4 VMs x 4). Trainer = 16 - (4 + 8) = 4 chips (one host).
  # Placement (multi-host): worker 0 started with --resources '{"trainer_tpu": 4}',
  # workers 1-3 with '{"explorer_tpu": 4}'; checkpoints/ is NFS-shared from worker 0.
  node_num: 4
  gpu_per_node: 4

buffer:
  total_steps: 100
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /home/haojun_shi/alf-data/tcod_tasks/train.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
    default_workflow_type: 'OPD_alfworld_workflow_fullmemory'
  trainer_input:
    experience_buffer:
      name: alfworld_opd_tpu_repro_1.7b_8b_tpu16_buffer
      storage_type: queue
      path: 'sqlite:///alfworld_opd_tpu_repro_1.7b_8b_tpu16_buffer.db'

explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 4  # GPU run: 3
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    - model_path: Qwen/Qwen3-8B
      engine_type: vllm_tpu
      # GPU run: 1. The teacher re-scores the full growing prompt with an 8B model every
      # turn (~4-5x the student's per-turn work), so it gets most explorer chips.
      engine_num: 8
      tensor_parallel_size: 1
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      # vLLM-TPU: leave ~7 GiB free for the prompt-logprobs (teacher scoring) program;
      # 16 GiB of bf16 weights + KV cache otherwise fill the chip at the 0.9 default.
      gpu_memory_utilization: 0.75
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix
  total_steps: 100
  save_interval: 25
  grad_clip: 1.0

monitor:
  monitor_type: tensorboard
