# Exact resume of webshop_ftb_qwen3_8b_to_1.7b_8chip_tpu from its step-100 state to step 140 (user, 2026-11-03: "continue
# training it for another 40 steps with the exact resume state"). Same run (name, dirs, buffer) as
# ftb_qwen3_8b_to_1.7b_8chip_tpu.yaml; only trainer.total_steps (100 -> 140) and save_interval (25 -> 70: the trainer
# saves on step % save_interval == 0, so this saves step 140 only) differ. The curriculum k = max(0, 14 - explore_step // 5)
# is already 0 from step 70 on, so steps 101-140 run as 71-100 did. Queue: ~/tcod_runs/ftb_webshop_resume100_to140.sh
#
# FutureBridge-OPD (FTB) on WebShop with the Qwen3-1.7B student / Qwen3-8B teacher, on HALF of the v4-32 (8 chips)
# (user, 2026-11-03: "make a webshop ftb run, schedule for 100 steps with save freq 25"). Everything as in
# ftb_qwen3_30b_to_4b_tpu.yaml (see its header: the release's WebShop workflow and prompts, curriculum, bridge
# settings, 8 runners per engine, teacher prompt limit 10240, thinking off), except:
#   - the models and the engine layout: 2 students + 2 teachers (Qwen3-8B, one chip each, as in the 1.7B/8B runs)
#   - 100 training steps with a checkpoint every 25 (as our 1.7B/8B WebShop runs; release: 200 / 50). The
#     curriculum (teacher plays k = 14 - explore_step // 5 steps) does not depend on total_steps.
# TPU fix (2026-11-03, as in the ALFWorld FTB workflow): NaN logprobs from vLLM-TPU (tokens it could not score) are
# replaced in the workflow (logprob_utils.fill_unscored) and in the trainer.
# TPU layout (one 2-host Ray cluster of its own, scripts/tpu/start_cluster_pair.sh): worker 0 = trainer (4 chips),
# worker 1 = 2 students + 2 teachers. Launcher: ~/tcod_runs/launch_webshop_qwen3_1.7b_8b_pair.sh ftb a
project: "WEBSHOP_TCOD"
name: "webshop_ftb_qwen3_8b_to_1.7b_8chip_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links) is used

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: /dev/shm/models/Qwen3-1.7B  # TPU: tmpfs copy on both hosts
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 2      # TPU: 2 VMs x 4 chips; trainer = 8 - (2 students + 2 teachers) = 4
  gpu_per_node: 4

buffer:
  total_steps: 3000  # explorer steps: upper bound only; the run ends on trainer.total_steps (release: 200)
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: webshop
      storage_type: file
      path: /home/haojun_shi/TCOD/TCOD_examples/webshop/webshop_data  # TCOD's 4096 train sessions = the release's data/webshop; on every worker
      split: train
      format:
        prompt_key: 'task_id'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 15
        total_steps: 100  # read by the workflow but not used by the linear curriculum
        checkpoint_strategy: linear
        checkpoint_steps: 5
        bridge_reward_threshold: 0.5
        bridge_max_per_ep: 1
        # The release's keys, verbatim. Its WebShop workflow does not read them (see header).
        bridge_position_top_k: 1
        continuation_steps: 3
        bridge_failed_episodes_only: false
        bridge_require_full_continuation: true
        b2f_prefix_source: reference
    default_workflow_type: 'trinity.common.workflows.envs.TCOD.webshop.futurebridge_workflow.FutureBridgeWebShopWorkflow'
  trainer_input:
    experience_buffer:
      name: webshop_ftb_qwen3_8b_to_1.7b_8chip_tpu_buffer
      storage_type: queue
      path: 'sqlite:////dev/shm/tcod_buffers/webshop_ftb_qwen3_8b_to_1.7b_8chip_tpu_buffer.db'  # node-local tmpfs

explorer:
  eval_interval: 9999   # as in the release: no evaluation during training
  eval_on_startup: false
  runner_per_model: 8   # as in the release
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 2  # TPU: 2 students, one chip each
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
    enable_thinking: false
  auxiliary_models:
    - model_path: /dev/shm/models/Qwen3-8B  # TPU: tmpfs copy on the inference host
      engine_type: vllm_tpu
      engine_num: 2  # TPU: 2 teachers, one chip each
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.75  # as in the 1.7B/8B ALFWorld FTB config (room for the scoring program)
      enable_prefix_caching: false
      enforce_eager: true
      enable_thinking: false
      dtype: bfloat16
      max_model_len: 20480
      max_prompt_tokens: 10240  # as in the release
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 140  # user, 2026-11-03: exact resume from step 100 (first launch: 100; release: 200)
  save_interval: 70  # saves step 140 only (first launch: 25; release: 50)
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
