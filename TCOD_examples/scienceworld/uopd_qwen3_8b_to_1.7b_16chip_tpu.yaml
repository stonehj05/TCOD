# UOPD on ScienceWorld, Qwen3-1.7B student / Qwen3-8B teacher, on the WHOLE v4-32 (16 chips), 250 steps (user,
# 2026-11-07: "make a UOPD config and run it for 250 steps"), as a baseline for the 1.7B/8B ScienceWorld runs
# (qwen3_1.7b_8b_opd_gated_t07_s03_dashtpl_keeprecent_deferred_16chip_tpu.yaml, dash_opd_qwen3_8b_to_1.7b_16chip_tpu.yaml,
# ftb_qwen3_8b_to_1.7b_16chip_tpu.yaml). Everything as uopd_qwen3_30b_to_4b_tpu.yaml (UOPD's release algorithm ported
# to ScienceWorld; see its header for what the workflow does and what differs from the release), except:
#   - student / teacher: tmpfs copies of plain Qwen3-1.7B / Qwen3-8B
#   - layout of the other 1.7B/8B ScienceWorld runs: worker 0 trainer (4 chips); workers 1-3 one explorer pool with
#     6 students + 6 teachers, one chip each (the teacher scores every turn and writes intervention turns in the
#     explorer); teacher gpu_memory_utilization 0.75 (as uopd_qwen3_8b_to_1.7b_8chip_tpu.yaml)
#   - explorer total_steps 600 (upper bound only, as the 1.7B ALFWorld UOPD run)
# Prompts stay one message per turn with the last 2 steps (max ~1k tokens), so no prompt truncation is needed.
# Evaluate with both templates at step 250 (EVAL_TEMPLATE=uopd and DASH-OPD's), the winner for steps 200 / 150.
# Launcher: ~/tcod_runs/launch_sciworld_uopd_qwen3_1.7b_8b_16chip.sh
project: "SCIENCEWORLD_TCOD"
name: "scienceworld_uopd_qwen3_8b_to_1.7b_16chip_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links for the checkpoints) is used

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6
    lr_warmup_steps_ratio: 0.0
  policy_loss_fn: uopd
  policy_loss_fn_args:
    loss_agg_mode: token-mean
    sft_coef: 1.0
    sft_mode: plain

model:
  model_path: /dev/shm/models/Qwen3-1.7B  # TPU: tmpfs copy on every worker
  max_prompt_tokens: 2048  # as the ALFWorld UOPD run (one message per turn)
  max_response_tokens: 512

cluster:
  node_num: 4      # TPU: 4 VMs x 4 chips; trainer = 16 - (6 students + 6 teachers) = 4
  gpu_per_node: 4

buffer:
  total_steps: 600  # explorer steps: upper bound only; the run ends on trainer.total_steps
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: sciworld
      storage_type: file
      path: /home/haojun_shi/sci-data/tcod_tasks/train.jsonl  # TCOD's get_sciworld_data.py split (2294 games); on every worker
      split: train
      format:
        prompt_key: 'task_desc'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:  # as the ALFWorld UOPD run (the release's, except max_env_steps)
        max_env_steps: 30  # as our other runs (release: 50)
        detect_uq: confidence
        detect_uq_seed: 0
        tau: 1.28
        detect_temperature: 1.0
        trigger_cap: null
        sft_warmup_steps: 0
        cold_start_takeover: false
        tau_mode: quantile
        rate_schedule: linear
        r_start: 0.3
        r_end: 0.05
        r_decay_steps: 120
        window_size: 1000
        window_n_min: 300
        teacher_sched: pipeline
        teacher_takeover: true
        temperature: 1.0
      task_selector:
        selector_type: random
        seed: 42
    default_workflow_type: 'UOPD_scienceworld_workflow'
  trainer_input:
    experience_buffer:
      name: scienceworld_uopd_qwen3_8b_to_1.7b_16chip_tpu_buffer
      storage_type: queue
      # Absolute path on node-local tmpfs (the dir must exist on every worker); see ftb_qwen3_30b_to_4b_tpu.yaml.
      path: 'sqlite:////dev/shm/tcod_buffers/scienceworld_uopd_qwen3_8b_to_1.7b_16chip_tpu_buffer.db'

explorer:
  runner_per_model: 8  # as in the release
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 6  # TPU: 6 students, one chip each (release: 2 x tensor_parallel 2 GPUs)
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    # Teacher: scores every Student turn and writes the response on intervention turns.
    - model_path: /dev/shm/models/Qwen3-8B  # TPU: tmpfs copy on workers 1-3
      engine_type: vllm_tpu
      engine_num: 6  # TPU: 6 teachers, one chip each (release: 1 x tensor_parallel 2 GPUs)
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.75  # as uopd_qwen3_8b_to_1.7b_8chip_tpu.yaml (room for the scoring program)
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384  # as the ALFWorld UOPD run; single-message prompts stay under ~1k tokens
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp
  eval_on_startup: false

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 250  # as in the release
  save_interval: 50  # all on worker 0 tmpfs (see the header); release: 250
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs

monitor:
  monitor_type: tensorboard
