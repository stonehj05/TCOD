# FutureBridge-OPD (FTB), "Look Ahead Before You Distill" (https://github.com/ChenChiShui/FutureBridge-OPD,
# commit e73603a), on ScienceWorld, Qwen3-1.7B student / Qwen3-8B teacher, on the WHOLE v4-32 (16 chips), 250 steps
# (user, 2026-11-06: "Build a ftb run for 250 steps and launch it"), as the baseline for
# qwen3_1.7b_8b_opd_gated_t07_s03_dashtpl_keeprecent_deferred_16chip_tpu.yaml and dash_opd_qwen3_8b_to_1.7b_16chip_tpu.yaml.
# Same workflow and release settings as ftb_qwen3_30b_to_4b_tpu.yaml (see its header for what the workflow does);
# differences from that file:
#   - student / teacher: tmpfs copies of plain Qwen3-1.7B / Qwen3-8B
#   - 250 training steps; workflow_args.total_steps set to match (the workflow stores it, but its linear
#     back-to-front curriculum only uses checkpoint_steps 5, unchanged); checkpoint every 50 (last three evaluated:
#     250 200 150)
#   - layout of the 1.7B/8B DASH-OPD ScienceWorld run: worker 0 trainer (4 chips); workers 1-3 one explorer pool with
#     6 students + 6 teachers, one chip each (the teacher scores every turn and writes the bridge actions in the
#     explorer); teacher gpu_memory_utilization 0.75, max_model_len 10752 (10240 prompt + 512)
#   - no prompt_truncation_keep_recent (DASH-OPD's switch, not in the FTB release): over-long prompts behave as in
#     the 4B FTB run
# Launcher: ~/tcod_runs/launch_sciworld_ftb_qwen3_1.7b_8b_16chip.sh
project: "SCIENCEWORLD_TCOD"
name: "scienceworld_ftb_qwen3_8b_to_1.7b_16chip_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links for the checkpoints) is used

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: /dev/shm/models/Qwen3-1.7B  # TPU: tmpfs copy on every worker
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 4      # TPU: 4 VMs x 4 chips; trainer = 16 - (6 students + 6 teachers) = 4
  gpu_per_node: 4

buffer:
  total_steps: 3000  # explorer steps: upper bound only; the run ends on trainer.total_steps
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: sciworld
      storage_type: file
      path: /home/haojun_shi/sci-data/tcod_tasks/train.jsonl  # TCOD's get_sciworld_data.py split (2294 games), as the release's data/scienceworld; on every worker
      split: train
      format:
        prompt_key: 'task_desc'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 30
        total_steps: 250  # = trainer.total_steps, as in the release (200 / 200); not read by the linear curriculum
        checkpoint_strategy: linear
        checkpoint_steps: 5
        # The release's keys, verbatim. Its ScienceWorld workflow does not read them (see header).
        bridge_max_per_ep: 1
        bridge_position_top_k: 1
        continuation_steps: 3
        bridge_failed_episodes_only: false
        bridge_require_full_continuation: true
    default_workflow_type: 'FutureBridgeScienceWorldWorkflow'
  trainer_input:
    experience_buffer:
      name: scienceworld_ftb_qwen3_8b_to_1.7b_16chip_tpu_buffer
      storage_type: queue
      path: 'sqlite:////dev/shm/tcod_buffers/scienceworld_ftb_qwen3_8b_to_1.7b_16chip_tpu_buffer.db'  # node-local tmpfs

explorer:
  eval_interval: 9999   # as in the release: no evaluation during training
  eval_on_startup: false
  runner_per_model: 8   # as in the release
  max_timeout: 3600
  rollout_model:
    engine_type: vllm_tpu
    engine_num: 6  # TPU: 6 students, one chip each (release: 2 x TP2)
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
    enable_thinking: false
  auxiliary_models:
    - model_path: /dev/shm/models/Qwen3-8B  # TPU: tmpfs copy on workers 1-3
      engine_type: vllm_tpu
      engine_num: 6  # TPU: 6 teachers, one chip each (release: 1 x TP2)
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.75  # TPU: as the 1.7B/8B DASH-OPD run (room for the scoring program)
      enable_prefix_caching: false
      enforce_eager: true
      enable_thinking: false
      dtype: bfloat16
      seed: 42
      max_model_len: 10752
      max_prompt_tokens: 10240  # as in the release
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 250  # release: 200
  save_interval: 50  # as in the release
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
