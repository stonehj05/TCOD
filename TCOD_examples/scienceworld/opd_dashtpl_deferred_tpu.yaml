# Vanilla OPD on ScienceWorld: the baseline for our gated ScienceWorld run,
# TCOD_examples/scienceworld/opd_gated_student_teacher_lookahead_t07_s03_dashtpl_deferred_tpu.yaml.
# Every value is that run's except the gate, which is gone: workflow OPD_scienceworld_workflow_dashtpl
# (trinity/common/workflows/envs/TCOD/scienceworld/OPD_workflow_dashtpl.py) keeps that run's student rollout
# unchanged (DASH-OPD's prompts, arXiv 2607.29078 Appendix L, TCOD's compact action list, the full
# conversation as memory, reward = best score / 100) and the teacher scores every turn at full weight,
# as the ALFWorld vanilla run (TCOD_examples/alfworld/opd_fullmemory_deferred_tpu.yaml). Deferred teacher
# scoring: the explorer only plays the games; the trainer has the teacher score each training batch's
# 64 turns (trinity/trainer/tunix/teacher_gate.py, gate_mode "always": no question).
# Training hyperparameters (TCOD's ScienceWorld ones, as the gated run): lr 1e-6, batch 16 games / 64 turns,
# staleness 2, kl_coef 1, 30 game steps, 10240 / 512 tokens, temperature 1.0, 250 steps, a checkpoint
# every 50 steps. Training metrics per explore step: rollout/env_score/mean and rollout/env_success/mean.
# Evaluate afterwards: bash scripts/tpu/eval/eval_all_sciworld_checkpoints.sh checkpoints/SCIENCEWORLD_TCOD/<name> <label>
#
# Storage (worker 0's disk is nearly full): every checkpoint (steps 50-250) and the run-dir buffer go to
# worker 0 tmpfs, symlinked into the run dir by ~/tcod_runs/launch_sciworld_vanilla_opd.sh (lost if worker 0 reboots).
#
# TPU layout (v4-32): worker 0 = trainer, workers 1-2 = one 30B-A3B teacher each, worker 3 = 4
# students. Launch: ~/tcod_runs/launch_sciworld_vanilla_opd.sh (cluster bring-up, checks, tmpfs links).
project: "SCIENCEWORLD_TCOD"
name: "scienceworld_opd_dashtpl_deferred_tpu"
checkpoint_root_dir: ./checkpoints
continue_from_checkpoint: true   # fresh run; true only so the pre-created run dir (tmpfs links) is used

# Mechanism: trinity/common/workflows/envs/TCOD/scienceworld/OPD_workflow_dashtpl.py
# Same plain Qwen3-4B student / plain Qwen3-30B-A3B teacher / full-memory setup as the ALFWorld runs.

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  # Student model: plain Qwen/Qwen3-4B, as our ALFWorld runs (TCOD's ScienceWorld opd.yaml: Qwen2.5-3B-Instruct).
  model_path: Qwen/Qwen3-4B
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 4      # TPU: 4 VMs x 4 chips; trainer = 16 - (4 students + 2 x 4 teacher) = 4
  gpu_per_node: 4

buffer:
  total_steps: 3000  # explorer steps: upper bound only (see header); the run ends on trainer.total_steps
  # Rollout batch: games per explore step. 16 as in the GPU configs (the sibling
  # opd_gated_disagree_lookahead_tpu.yaml uses 8).
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: sciworld
      storage_type: file
      path: /home/haojun_shi/sci-data/tcod_tasks/train.jsonl  # TCOD's get_sciworld_data.py split (2294 games, 17 task types); on every worker
      split: train
      format:
        prompt_key: 'task_desc'
      rollout_args:
        temperature: 1.0
        # Required by OPD workflow to compute student-teacher token logprob gap
        logprobs: 0
      workflow_args:
        temperature: 1.0  # as TCOD's ScienceWorld configs (the workflow default)
        max_env_steps: 30
        # The trainer has the teacher score the turns it samples; the explorer makes no teacher call.
        defer_teacher: true
        trainer_teacher_parallel_prompts: 32   # requests in flight per teacher engine
    default_workflow_type: 'OPD_scienceworld_workflow_dashtpl'
  trainer_input:
    experience_buffer:
      name: scienceworld_opd_dashtpl_deferred_tpu_buffer
      storage_type: queue
      path: 'sqlite:////dev/shm/tcod_buffers/scienceworld_opd_dashtpl_deferred_tpu_buffer.db'  # node-local tmpfs: keeps the queue's second copy out of a home directory

explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    # engine_num=2, tensor_parallel_size=1 -- matches opd_gated_lookahead.yaml.
    engine_type: vllm_tpu
    engine_num: 4  # TPU: 4 students, one chip each (GPU run: 2)
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    # Teacher model: plain Qwen/Qwen3-30B-A3B, as our ALFWorld runs (TCOD's opd.yaml: /path/to/teacher). Called once per turn for logprobs scoring.
    - model_path: /dev/shm/models/Qwen3-30B-A3B  # TPU: tmpfs copy on each teacher VM (start_cluster.sh)
      engine_type: vllm_tpu
      engine_num: 2  # TPU: two teachers, one whole VM each (GPU run: 1)
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.8  # TPU: tested on v4 (fits; 321k-token KV cache)
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'checkpoint'  # TPU: NCCL is CUDA-only
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tunix  # TPU: JAX trainer (verl's dynamic-bsz / ulysses settings don't apply)
  total_steps: 250
  save_interval: 50  # all on worker 0 tmpfs (see the header); GPU run: 25
  grad_clip: 1.0
  sync_checkpoint_dir: /dev/shm/tcod_sync  # TPU: per-step weight-sync checkpoints on tmpfs

monitor:
  monitor_type: tensorboard  # TPU run: no wandb credentials on this machine
